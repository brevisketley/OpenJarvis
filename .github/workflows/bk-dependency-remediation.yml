name: BK dependency remediation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bk-dependency-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the selected remediation branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Install pinned uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.19"
      - name: Upgrade only packages with published security fixes
        env:
          UV_CONCURRENT_DOWNLOADS: "4"
          UV_CONCURRENT_BUILDS: "2"
          UV_CONCURRENT_INSTALLS: "2"
        run: |
          uv lock \
            --upgrade-package aiohttp \
            --upgrade-package anyio \
            --upgrade-package datasets \
            --upgrade-package filelock \
            --upgrade-package fsspec \
            --upgrade-package lxml \
            --upgrade-package multidict \
            --upgrade-package pygments \
            --upgrade-package python-dotenv \
            --upgrade-package requests \
            --upgrade-package setuptools \
            --upgrade-package urllib3
      - name: Verify lock consistency
        run: uv lock --check
      - name: Commit updated lockfile to selected branch
        run: |
          if git diff --quiet -- uv.lock; then
            echo "No lockfile changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "fix: update dependencies with published security fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
